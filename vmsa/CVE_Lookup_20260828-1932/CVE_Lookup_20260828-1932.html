of the host only by manipulating the processed input stream. No user is affected, who followed the recommendation to setup XStream\u0027s security framework with a whitelist limited to the minimal required types. XStream 1.4.18 uses no longer a blacklist by default, since it cannot be secured for general purpose.","CVSSv3":"8.5","Severity":"HIGH","Published":"2021-08-23","References":"http://packetstormsecurity.com/files/169859/VMware-NSX-Manager-XStream-Unauthenticated-Remote-Code-Execution.html; https://github.com/x-stream/xstream/security/advisories/GHSA-j9h8-phrw-h4fh; https://lists.debian.org/debian-lts-announce/2021/09/msg00017.html","AdvisoryIDs":"VCDSA23646","AdvisoryCount":"1"},{"No":1241,"CVE":"CVE-2021-44228","Description":"Apache Log4j2 2.0-beta9 through 2.15.0 (excluding security releases 2.12.2, 2.12.3, and 2.3.1) JNDI features used in configuration, log messages, and parameters do not protect against attacker controlled LDAP and other JNDI related endpoints. An attacker who can control log messages or log message parameters can execute arbitrary code loaded from LDAP servers when message lookup substitution is enabled. From log4j 2.15.0, this behavior has been disabled by default. From version 2.16.0 (along with 2.12.2, 2.12.3, and 2.3.1), this functionality has been completely removed. Note that this vulnerability is specific to log4j-core and does not affect log4net, log4cxx, or other Apache Logging Services projects.","CVSSv3":"10.0","Severity":"CRITICAL","Published":"2021-12-10","References":"http://packetstormsecurity.com/files/165225/Apache-Log4j2-2.14.1-Remote-Code-Execution.html; http://packetstormsecurity.com/files/165260/VMware-Security-Advisory-2021-0028.html; http://packetstormsecurity.com/files/165261/Apache-Log4j2-2.14.1-Information-Disclosure.html","AdvisoryIDs":"VCDSA23626; VCDSA23618","AdvisoryCount":"2"},{"No":1242,"CVE":"CVE-2021-44832","Description":"Apache Log4j2 versions 2.0-beta7 through 2.17.0 (excluding security fix releases 2.3.2 and 2.12.4) are vulnerable to a remote code execution (RCE) attack when a configuration uses a JDBC Appender with a JNDI LDAP data source URI when an attacker has control of the target LDAP server. This issue is fixed by limiting JNDI data source names to the java protocol in Log4j2 versions 2.17.1, 2.12.4, and 2.3.2.","CVSSv3":"6.6","Severity":"MEDIUM","Published":"2021-12-28","References":"http://www.openwall.com/lists/oss-security/2021/12/28/1; https://cert-portal.siemens.com/productcert/pdf/ssa-784507.pdf; https://issues.apache.org/jira/browse/LOG4J2-3293","AdvisoryIDs":"VCDSA23618","AdvisoryCount":"1"},{"No":1243,"CVE":"CVE-2021-45046","Description":"It was found that the fix to address CVE-2021-44228 in Apache Log4j 2.15.0 was incomplete in certain non-default configurations. This could allows attackers with control over Thread Context Map (MDC) input data when the logging configuration uses a non-default Pattern Layout with either a Context Lookup (for example, $${ctx:loginId}) or a Thread Context Map pattern (%X, %mdc, or %MDC) to craft malicious input data using a JNDI Lookup pattern resulting in an information leak and remote code execution in some environments and local code execution in all environments. Log4j 2.16.0 (Java 8) and 2.12.2 (Java 7) fix this issue by removing support for message lookup patterns and disabling JNDI functionality by default.","CVSSv3":"9.0","Severity":"CRITICAL","Published":"2021-12-14","References":"http://www.openwall.com/lists/oss-security/2021/12/14/4; http://www.openwall.com/lists/oss-security/2021/12/15/3; http://www.openwall.com/lists/oss-security/2021/12/18/1","AdvisoryIDs":"VCDSA23618","AdvisoryCount":"1"},{"No":1244,"CVE":"CVE-2021-45105","Description":"Apache Log4j2 versions 2.0-alpha1 through 2.16.0 (excluding 2.12.3 and 2.3.1) did not protect from uncontrolled recursion from self-referential lookups. This allows an attacker with control over Thread Context Map data to cause a denial of service when a crafted string is interpreted. This issue was fixed in Log4j 2.17.0, 2.12.3, and 2.3.1.","CVSSv3":"5.9","Severity":"MEDIUM","Published":"2021-12-18","References":"http://www.openwall.com/lists/oss-security/2021/12/19/1; https://cert-portal.siemens.com/productcert/pdf/ssa-479842.pdf; https://cert-portal.siemens.com/productcert/pdf/ssa-501673.pdf","AdvisoryIDs":"VCDSA23618","AdvisoryCount":"1"},{"No":1245,"CVE":"CVE-2022-21123","Description":"Incomplete cleanup of multi-core shared buffers for some Intel(R) Processors may allow an authenticated user to potentially enable information disclosure via local access.","CVSSv3":"5.5","Severity":"MEDIUM","Published":"2022-06-15","References":"http://www.openwall.com/lists/oss-security/2022/06/16/1; https://lists.debian.org/debian-lts-announce/2022/07/msg00000.html; https://lists.fedoraproject.org/archives/list/package-announce%40lists.fedoraproject.org/message/FHTEW3RXU2GW6S3RCPQG4VNCZGI3TOSV/","AdvisoryIDs":"VCDSA23632","AdvisoryCount":"1"},{"No":1246,"CVE":"CVE-2022-21125","Description":"Incomplete cleanup of microarchitectural fill buffers on some Intel(R) Processors may allow an authenticated user to potentially enable information disclosure via local access.","CVSSv3":"5.5","Severity":"MEDIUM","Published":"2022-06-15","References":"http://www.openwall.com/lists/oss-security/2022/06/16/1; http://xenbits.xen.org/xsa/advisory-404.html; https://lists.debian.org/debian-lts-announce/2022/07/msg00000.html","AdvisoryIDs":"VCDSA23632","AdvisoryCount":"1"},{"No":1247,"CVE":"CVE-2022-21166","Description":"Incomplete cleanup in specific special register write operations for some Intel(R) Processors may allow an authenticated user to potentially enable information disclosure via local access.","CVSSv3":"5.5","Severity":"MEDIUM","Published":"2022-06-15","References":"http://www.openwall.com/lists/oss-security/2022/06/16/1; https://lists.debian.org/debian-lts-announce/2022/07/msg00000.html; https://lists.fedoraproject.org/archives/list/package- function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function sevBadgeClass(s) {
  const v = (s || "").toLowerCase();
  if (v.indexOf("crit") !== -1) return "badge-critical";
  if (v.indexOf("high") !== -1) return "badge-high";
  if (v.indexOf("med") !== -1) return "badge-medium";
  if (v.indexOf("low") !== -1) return "badge-low";
  return "badge-default";
}

function buildReferences(refs) {
  if (!refs) return "";
  return refs.split(";").map(function (r) { return r.trim(); }).filter(Boolean).map(function (url) {
    return '<div><a href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(url) + "</a></div>";
  }).join("");
}

function renderList(items) {
  const container = document.getElementById("resultList");
  if (items.length === 0) {
    container.innerHTML = '<p class="muted">No matching CVE found.</p>';
    return;
  }
  container.innerHTML = items.map(function (r) {
    return '<div class="cve-card">' +
      '<div class="cve-head"><span class="cve-id">' + esc(r.CVE) + '</span>' +
      '<span class="badge ' + sevBadgeClass(r.Severity) + '">' + esc((r.Severity || "N/A").toUpperCase()) + "</span></div>" +
      '<div class="cve-meta">CVSSv3: ' + esc(r.CVSSv3) + " &nbsp;|&nbsp; Published: " + esc(r.Published) + "</div>" +
      '<p class="cve-desc">' + esc(r.Description) + "</p>" +
      '<div class="cve-refs">' + buildReferences(r.References) + "</div>" +
      (r.AdvisoryIDs ? '<div class="cve-advisories">Related VMSA advisories: ' + esc(r.AdvisoryIDs) + "</div>" : "") +
      "</div>";
  }).join("");
}

function runSearch() {
  const q = document.getElementById("searchBox").value.trim().toLowerCase();
  const summary = document.getElementById("searchSummary");
  let matched;
  if (!q) {
    matched = RECORDS;
    summary.textContent = "Showing all " + matched.length + " CVE(s). Type above to search.";
  } else {
    matched = RECORDS.filter(function (r) { return r.CVE.toLowerCase().indexOf(q) !== -1; });
    summary.textContent = matched.length + " CVE(s) match \"" + q + "\".";
  }
  renderList(matched);
}

function init() {
  document.getElementById("totalCount").textContent = RECORDS.length;
  document.getElementById("searchBox").addEventListener("input", runSearch);
  runSearch();
}

document.addEventListener("DOMContentLoaded", init);
</script>
